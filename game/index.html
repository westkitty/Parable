<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parable</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #c { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
      #fade { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 1; }
      .bubble {
        position: fixed; transform: translate(-50%, -100%); max-width: 300px; padding: 9px 14px;
        background: #fbf3df; color: #3b2a1a; border-radius: 14px; box-shadow: 0 3px 12px rgba(40, 20, 0, 0.35);
        font: 15px/1.3 Georgia, "Times New Roman", serif; pointer-events: none; white-space: normal; text-align: center;
      }
      .bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -8px;
        border: 9px solid transparent; border-bottom: 0; border-top-color: #fbf3df;
      }
      #f3 {
        position: fixed; left: 8px; top: 8px; margin: 0; padding: 8px 10px; background: rgba(0, 0, 0, 0.62);
        color: #d8f5c8; font: 12px/1.35 ui-monospace, Menlo, monospace; pointer-events: none; max-width: 70vw; white-space: pre-wrap;
      }
      #fatal { position: fixed; left: 12px; top: 12px; color: #f88; font: 14px monospace; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
